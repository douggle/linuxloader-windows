# Mucha front for a WMMT4 cabinet: TLS 1.0 termination on port 10082.
#
# Alternative to the nginx stream block, for boxes where nginx has no stream
# module built in. Nothing else changes: the cabinet still dials :10082 and
# mucha_backend.py still listens on 127.0.0.1:11082.
#
#   sudo apt install stunnel4
#   sudo cp mucha.crt mucha.key /etc/stunnel/        # RSA key, see below
#   sudo cp stunnel-10082.conf /etc/stunnel/mucha.conf
#   sudo systemctl enable --now stunnel4
#   # or, without systemd:  sudo stunnel /etc/stunnel/mucha.conf
#
# Certificate (self-signed is fine; it must be RSA - the client only does RSA
# key exchange):
#
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#        -subj "/CN=v388-front.mucha-prd.nbgi-amnet.jp" \
#        -keyout mucha.key -out mucha.crt

foreground = no
pid        = /run/stunnel-mucha.pid
output     = /var/log/stunnel-mucha.log
debug      = 4

[mucha-10082]
accept  = 0.0.0.0:10082
connect = 127.0.0.1:11082

cert = /etc/stunnel/mucha.crt
key  = /etc/stunnel/mucha.key

# Exactly what the cabinet's OpenSSL 0.9.8a offers.
sslVersionMin = TLSv1
sslVersionMax = TLSv1
ciphers       = AES128-SHA:@SECLEVEL=0:DES-CBC3-SHA:@SECLEVEL=0
options       = NO_TLSv1_1:NO_TLSv1_2

# The client does not send close_notify; without this stunnel waits on a
# half-open connection until the timeout.
TIMEOUTclose = 0
