# Mucha front for a WMMT4 cabinet: TLS 1.0 termination on port 10082.
#
# The cabinet's client is OpenSSL 0.9.8a: it offers TLS 1.0 with RSA key
# exchange and AES128-SHA / 3DES. nginx must be told to accept exactly that,
# and on OpenSSL 3 also to drop its security level for these ciphers.
#
# WHERE THIS GOES: nginx's `stream` context cannot live in http/sites-enabled.
# Put this block at the TOP LEVEL of /etc/nginx/nginx.conf (a sibling of the
# existing `http { ... }` block, outside it), then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# The 80/443 vhosts are untouched; stream/10082 is a separate listener.
#
# Certificate (self-signed is fine: the loader sets SSL_CTX_set_verify(0), and
# the cabinet does not verify either, but it must be RSA - the client only does
# RSA key exchange):
#
#   sudo mkdir -p /etc/nginx/tls
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#        -subj "/CN=v388-front.mucha-prd.nbgi-amnet.jp" \
#        -keyout /etc/nginx/tls/mucha.key -out /etc/nginx/tls/mucha.crt
#
# Backend: mucha_backend.py from this directory, plaintext, on 11082.

stream {
    # Mucha (board authentication, update check)
    server {
        listen 10082 ssl;

        ssl_certificate     /etc/nginx/tls/mucha.crt;
        ssl_certificate_key /etc/nginx/tls/mucha.key;

        # Strictly TLS 1.0 - what the cabinet actually offers. Do not add
        # 1.2/1.3: they are not used by the client and only widen exposure.
        ssl_protocols TLSv1;

        # RSA key exchange + a 2010-era bulk cipher. @SECLEVEL=0 is required
        # because OpenSSL 3 rejects both the protocol and these ciphers at its
        # default security level.
        ssl_ciphers 'AES128-SHA:@SECLEVEL=0:DES-CBC3-SHA:@SECLEVEL=0';
        ssl_prefer_server_ciphers on;

        # TLS 1.3 suites are irrelevant here; clearing them keeps OpenSSL 3
        # from offering a 1.3 handshake that cannot complete on this listener.
        ssl_conf_command Ciphersuites "";

        # Old client: no session cache, no tickets, no resumption.
        ssl_session_cache   off;
        ssl_session_tickets off;

        proxy_pass 127.0.0.1:11082;
        proxy_connect_timeout 5s;
        proxy_timeout 30s;
    }
}
