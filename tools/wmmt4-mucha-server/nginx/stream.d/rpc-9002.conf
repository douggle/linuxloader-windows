# Game server for a WMMT4 cabinet: TLS 1.0 termination on :9002.
#
# Same shape as mucha-10082.conf: the cabinet's client is OpenSSL 0.9.8a, so
# TLS 1.0 with RSA key exchange and AES128-SHA, and nothing newer.
#
# This file belongs at  /etc/nginx/stream.d/rpc-9002.conf
# pulled in by the top-level  stream { include /etc/nginx/stream.d/*.conf; }
#
# Plaintext backend: rpc_backend.py -> 127.0.0.1:19002.
# Certificate: shared with the Mucha listener (/etc/nginx/tls/mucha.*); the
# cabinet does not verify it and the loader turns verification off.

server {
    listen 9002 ssl;

    ssl_certificate     /etc/nginx/tls/mucha.crt;
    ssl_certificate_key /etc/nginx/tls/mucha.key;

    ssl_protocols TLSv1;
    ssl_ciphers 'AES128-SHA:@SECLEVEL=0:DES-CBC3-SHA:@SECLEVEL=0';
    ssl_prefer_server_ciphers on;
    ssl_conf_command Ciphersuites "";

    ssl_session_cache   off;
    ssl_session_tickets off;

    # The game keeps the connection for many RPCs; give it room to breathe.
    proxy_pass 127.0.0.1:19002;
    proxy_connect_timeout 5s;
    proxy_timeout 120s;
}
