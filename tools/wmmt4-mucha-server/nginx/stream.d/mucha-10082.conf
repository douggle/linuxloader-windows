# Mucha front for a WMMT4 cabinet: TLS 1.0 termination on :10082.
#
# This file belongs at  /etc/nginx/stream.d/mucha-10082.conf
# and is pulled in by a top-level block in /etc/nginx/nginx.conf:
#
#     stream {
#         include /etc/nginx/stream.d/*.conf;
#     }
#
# (install.sh adds that block for you, with a backup and `nginx -t` guard.)
#
# Plaintext backend: mucha_backend.py -> 127.0.0.1:11082.
#
# Cert must be RSA (the cabinet's OpenSSL 0.9.8a only does RSA key exchange):
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#        -subj "/CN=v388-front.mucha-prd.nbgi-amnet.jp" \
#        -keyout /etc/nginx/tls/mucha.key -out /etc/nginx/tls/mucha.crt

server {
    listen 10082 ssl;

    ssl_certificate     /etc/nginx/tls/mucha.crt;
    ssl_certificate_key /etc/nginx/tls/mucha.key;

    # Strictly TLS 1.0 - what the cabinet offers, and nothing else.
    ssl_protocols TLSv1;

    # RSA key exchange + 2010-era bulk ciphers. @SECLEVEL=0 is required:
    # OpenSSL 3 refuses both the protocol and these ciphers at its default
    # security level.
    ssl_ciphers 'AES128-SHA:@SECLEVEL=0:DES-CBC3-SHA:@SECLEVEL=0';
    ssl_prefer_server_ciphers on;

    # TLS 1.3 suites play no part on a TLS 1.0 listener; clearing them stops
    # OpenSSL 3 from offering a handshake this listener cannot finish.
    ssl_conf_command Ciphersuites "";

    ssl_session_cache   off;
    ssl_session_tickets off;

    proxy_pass 127.0.0.1:11082;
    proxy_connect_timeout 5s;
    proxy_timeout 30s;
}
