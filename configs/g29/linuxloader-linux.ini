# Linux Loader configuration: a Logitech G29 driving Cruis'n Blast.
#
# INPUT_MODE 2 reads the wheel through evdev. The [EVDEV] lines below are the
# cabinet's own controls, as the game's descriptor asks for them:
#
#   ANALOGUE_1  steering wheel   (left 0 .. right 65535, centre ~32768)
#   ANALOGUE_2  gas pedal        (released 0 .. floored 65535)
#   ANALOGUE_3  brake pedal      (released 0 .. floored 65535)
#
# The names are the ones `./linuxloader --list-controllers` prints.
#
# The keyboard drives too, beside the wheel: A/D steer, W gas, S brake.

[Input]
# 1 = SDL (keyboard and mouse), 2 = evdev (the controllers below).
INPUT_MODE = 2

[EVDEV]
# The wheel: 0..65535 with its centre near 32768. The middle deadzone stops the
# wheel's resting jitter from reading as a slight turn.
ANALOGUE_1 = LOGITECH_G29_DRIVING_FORCE_RACING_WHEEL_ABS_X
ANALOGUE_DEADZONE_1 = 2 3 0

# The pedals rest at their maximum (255) and read 0 fully pressed, hence the
# _NEG suffix, which reverses the axis. On the G29 the gas pedal is Z, the
# brake RZ and the clutch Y (left unmapped).
ANALOGUE_2 = LOGITECH_G29_DRIVING_FORCE_RACING_WHEEL_ABS_Z_NEG
ANALOGUE_3 = LOGITECH_G29_DRIVING_FORCE_RACING_WHEEL_ABS_RZ_NEG
ANALOGUE_DEADZONE_2 = 2 0 0
ANALOGUE_DEADZONE_3 = 2 0 0

# The buttons: the face buttons for the game's menus, the d-pad for its up and
# down. Service (a credit) and test stay on the keyboard's F1 and F2, as the
# game's own map has them; Start and coin also stay on the keyboard's 1, 5, 6.
#
# Start is the wheel's button 9 and coin its button 8, as jstest numbers them
# (0-based, in the order the wheel reports them): BTN_BASE4 and BTN_BASE3.
PLAYER_1_BUTTON_START = LOGITECH_G29_DRIVING_FORCE_RACING_WHEEL_BTN_BASE4
PLAYER_1_COIN = LOGITECH_G29_DRIVING_FORCE_RACING_WHEEL_BTN_BASE3
PLAYER_1_BUTTON_2 = LOGITECH_G29_DRIVING_FORCE_RACING_WHEEL_BTN_TOP
PLAYER_1_BUTTON_3 = LOGITECH_G29_DRIVING_FORCE_RACING_WHEEL_BTN_TOP2
PLAYER_1_BUTTON_UP = LOGITECH_G29_DRIVING_FORCE_RACING_WHEEL_ABS_HAT0Y_MIN
PLAYER_1_BUTTON_DOWN = LOGITECH_G29_DRIVING_FORCE_RACING_WHEEL_ABS_HAT0Y_MAX
