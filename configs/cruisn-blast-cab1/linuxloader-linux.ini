# Linux Loader configuration: cabinet 1 of a linked pair of Cruis'n Blast
# cabinets.
#
#   cabinet 1  192.168.1.127   (this machine, this file)
#   cabinet 2  192.168.1.189   (configs/cruisn-blast-cab2/linuxloader-linux.ini)
#
# Run with this file here, and the cabinet 2 file on the other machine:
#
#   ./linuxloader -g "/path/to/CruisnBlast" \
#       -c configs/cruisn-blast-cab1/linuxloader-linux.ini
#
# Cruis'n Blast links over the LAN by broadcast: the game has no cabinet IP
# in any file of its own, it finds its peers on the link NIC's subnet itself
# (it is the game that calls getifaddrs/inet_addr, not the loader). What the
# pair needs is, on each machine:
#
#  1. The link NIC holding that cabinet's address, /24. Here, once:
#
#       nmcli con add type ethernet ifname <nic> con-name link \
#           ip4 192.168.1.127/24
#
#     or, without NetworkManager:
#
#       ip addr add 192.168.1.127/24 dev <nic>
#
#     <nic> is the link port, as `ip -br link` prints it.
#
#  2. The game's own test menu (hold TEST / F2) > NETWORK ADJUSTMENTS:
#     ENABLE MULTIPLAYER on, NETWORK MACHINE ID 1 on this cabinet and 2 on
#     the one at 192.168.1.189. Both cabinets run the same game version, and
#     both are started together: the link is formed as they boot.
#
# [Network] below: the loader answers the game's link lookup with IP_CAB1 here
# (machine ID 1) and IP_CAB2 on the cabinet at 192.168.1.189 (machine ID 2),
# so the link stays on those two addresses whatever the port is called. The
# pair is also what Harley / Hummer / R-Tuned read. NIC_NAME is the port the
# loader's other network patches look up; empty leaves it alone.

[Network]
# 1 = apply the loader's network patches (NIC name, per-cabinet IPs, ...)
ENABLE_NETWORK_PATCHES = true

# The link NIC, when it is not eth0 (empty = leave the game's lookup alone).
NIC_NAME = ""

# The pair, cabinet 1 first.
IP_CAB1 = "192.168.1.127"
IP_CAB2 = "192.168.1.189"
