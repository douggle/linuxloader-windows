# Linux Loader configuration: a DualShock 4 driving Cruis'n Blast.
#
# Raw Thrills games on Linux read controllers through evdev only: controls.ini
# (GC0_/JOY0_ bindings) is not used for them. Run with this file instead of
# the G29 one (configs/g29/linuxloader-linux.ini):
#
#   ./linuxloader -g /path/to/CruisnBlast -c /path/to/configs/ds4/linuxloader-linux.ini
#
# The cabinet's controls, as the game's descriptor asks for them:
#
#   ANALOGUE_1  steering wheel   (left 0 .. right 65535, centre ~32768)
#   ANALOGUE_2  gas pedal        (released 0 .. floored 65535)
#   ANALOGUE_3  brake pedal      (released 0 .. floored 65535)
#
# The names are the ones `./linuxloader --list-controllers` prints. The
# keyboard drives too, beside the pad: A/D steer, W gas, S brake.

[Input]
# 1 = SDL (keyboard and mouse), 2 = evdev (the controllers below).
INPUT_MODE = 2

[EVDEV]
# Left stick steers: 0..255 with its centre at 128. The middle deadzone stops
# the stick's resting drift from reading as a slight turn.
ANALOGUE_1 = SONY_INTERACTIVE_ENTERTAINMENT_WIRELESS_CONTROLLER_ABS_X
ANALOGUE_DEADZONE_1 = 2 3 0

# R2 gas, L2 brake: the triggers rest at 0 and read 255 fully pressed, so
# unlike the G29's pedals they need no _NEG.
ANALOGUE_2 = SONY_INTERACTIVE_ENTERTAINMENT_WIRELESS_CONTROLLER_ABS_RZ
ANALOGUE_3 = SONY_INTERACTIVE_ENTERTAINMENT_WIRELESS_CONTROLLER_ABS_Z
ANALOGUE_DEADZONE_2 = 2 0 0
ANALOGUE_DEADZONE_3 = 2 0 0

# Options starts, Share adds a coin; Triangle changes the view, Square the
# music; the d-pad moves up and down in the menus (the volume in a race).
# Service and test stay on the keyboard's F1 and F2.
PLAYER_1_BUTTON_START = SONY_INTERACTIVE_ENTERTAINMENT_WIRELESS_CONTROLLER_BTN_START
PLAYER_1_COIN = SONY_INTERACTIVE_ENTERTAINMENT_WIRELESS_CONTROLLER_BTN_SELECT
PLAYER_1_BUTTON_2 = SONY_INTERACTIVE_ENTERTAINMENT_WIRELESS_CONTROLLER_BTN_NORTH
PLAYER_1_BUTTON_3 = SONY_INTERACTIVE_ENTERTAINMENT_WIRELESS_CONTROLLER_BTN_WEST
PLAYER_1_BUTTON_UP = SONY_INTERACTIVE_ENTERTAINMENT_WIRELESS_CONTROLLER_ABS_HAT0Y_MIN
PLAYER_1_BUTTON_DOWN = SONY_INTERACTIVE_ENTERTAINMENT_WIRELESS_CONTROLLER_ABS_HAT0Y_MAX
