# Cruis'n Blast with a DualShock 4 on Windows, the G29 left out (both bound to
# player 1, the wheel's constant input takes the steering over). Run with:
#
#   linuxloader.exe -g games\CruisnBlast -o configs\ds4\controls-windows.ini
#
# GC0_ and GC1_ both: the pad is player 1's or, with the wheel plugged in and
# matched first, player 2's. Left stick steers, R2 gas, L2 brake, Cross and
# Circle boost, Triangle view, Square music, R1/L1 gears, d-pad the menus,
# Share coin, Options start.

[Config]
Steer_DeadZone = 150
Gas_DeadZone = 300
Brake_DeadZone = 300
FLYING_X_DeadZone = 500
FLYING_Y_DeadZone = 500
Throttle_DeadZone = 500
GunX_Centering = 1
GunY_Centering = 1
ShakeIncreaseRate = 1.0
ShakeDecayRate = 0.95
ShakeMinScreenFraction = 0.15
CardInsert_Toggle = 1
Card1Insert_Toggle = 1
Card2Insert_Toggle = 1

[Common]
Test = KEY_T, JOY0_BUTTON_24
ExitGame = KEY_Escape, JOY0_BUTTON_8 + JOY0_BUTTON_9
P1_Coin = KEY_5, JOY0_BUTTON_8, GC0_BUTTON_BACK, GC1_BUTTON_BACK
P2_Coin = KEY_6
P1_Start = KEY_1, JOY0_BUTTON_9, GC0_BUTTON_START, GC1_BUTTON_START
P2_Start = KEY_2
P1_Service = KEY_S, JOY0_BUTTON_20

[Driving]
P1_Steer = GC0_AXIS_LEFTX, GC1_AXIS_LEFTX
P1_Gas = GC0_AXIS_RIGHTTRIGGER, GC1_AXIS_RIGHTTRIGGER
P1_Brake = GC0_AXIS_LEFTTRIGGER, GC1_AXIS_LEFTTRIGGER
P1_Steer_Left = KEY_Left
P1_Steer_Right = KEY_Right
P1_Gas_Digital = KEY_Up
P1_Brake_Digital = KEY_Down
Boost = KEY_Q, GC0_BUTTON_A, GC1_BUTTON_A
BoostRight = KEY_W, GC0_BUTTON_B, GC1_BUTTON_B
ViewChange = KEY_V, GC0_BUTTON_Y, GC1_BUTTON_Y
MusicChange = KEY_M, GC0_BUTTON_X, GC1_BUTTON_X
GearUp = KEY_A, GC0_BUTTON_RIGHTSHOULDER, GC1_BUTTON_RIGHTSHOULDER
GearDown = KEY_Z, GC0_BUTTON_LEFTSHOULDER, GC1_BUTTON_LEFTSHOULDER
Up = KEY_I, GC0_BUTTON_DPUP, GC1_BUTTON_DPUP
Down = KEY_K, GC0_BUTTON_DPDOWN, GC1_BUTTON_DPDOWN
Left = KEY_J, GC0_BUTTON_DPLEFT, GC1_BUTTON_DPLEFT
Right = KEY_L, GC0_BUTTON_DPRIGHT, GC1_BUTTON_DPRIGHT
CardInsert = KEY_F7, JOY0_BUTTON_23

[Shooting]
P1_GunX = MOUSE_AXIS_X, GC0_AXIS_LEFTX, GC1_AXIS_LEFTX
P1_GunY = MOUSE_AXIS_Y, GC0_AXIS_LEFTY, GC1_AXIS_LEFTY
P1_Trigger = MOUSE_LEFT_BUTTON, KEY_Q, GC0_AXIS_RIGHTTRIGGER_POSITIVE, GC0_BUTTON_RIGHTSHOULDER, GC1_AXIS_RIGHTTRIGGER_POSITIVE, GC1_BUTTON_RIGHTSHOULDER
P1_Reload = MOUSE_RIGHT_BUTTON, KEY_W, GC0_AXIS_LEFTTRIGGER_POSITIVE, GC0_BUTTON_LEFTSHOULDER, GC1_AXIS_LEFTTRIGGER_POSITIVE, GC1_BUTTON_LEFTSHOULDER
P1_GunButton = MOUSE_MIDDLE_BUTTON, KEY_E, GC0_BUTTON_A, GC1_BUTTON_A
P1_ActionButton = KEY_R, GC0_BUTTON_X, GC1_BUTTON_X

